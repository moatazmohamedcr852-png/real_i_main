<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - REAL_i</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #030712; color: #f3f4f6; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
    <h2 class="text-2xl font-bold mb-2 text-white">Change Password</h2>
    <p class="text-gray-400 text-sm mb-6">Enter the OTP sent to your email and your new password.</p>

    <div id="alert" class="hidden mb-4 p-3 rounded-xl text-sm font-medium"></div>

    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">Email</label>
        <input type="email" id="email" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-blue-500" required readonly>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">6-Digit OTP</label>
        <input type="text" id="otp" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-blue-500" required>
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-gray-400 mb-1">New Password</label>
        <input type="password" id="newPassword" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2 text-white outline-none focus:border-blue-500" minlength="6" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-colors mt-4">
        Reset Password
      </button>
    </form>

    <div class="mt-4 text-center">
      <a href="/login" class="text-xs text-blue-500 hover:text-blue-400 font-semibold">← Back to Sign In</a>
    </div>
  </div>

  <script>
    // Pre-fill email from URL
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('email')) {
      document.getElementById('email').value = urlParams.get('email');
    }

    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alert');

    function showAlert(message, isError) {
      alertBox.textContent = message;
      alertBox.className = `mb-4 p-3 rounded-xl text-sm font-medium block ${isError ? 'bg-red-900/30 border border-red-800 text-red-400' : 'bg-green-900/30 border border-green-800 text-green-400'}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const otp = document.getElementById('otp').value;
      const newPassword = document.getElementById('newPassword').value;

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, newPassword })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error?.message || 'Failed to reset password', true);
        } else {
          showAlert(data.message || 'Password changed successfully! You can now login.', false);
          form.reset();
          setTimeout(() => window.location.href = '/login', 3000);
        }
      } catch (err) {
        showAlert('Network error occurred.', true);
      }
    });
  </script>
</body>
</html>
